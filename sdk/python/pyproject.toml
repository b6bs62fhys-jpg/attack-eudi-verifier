[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eudi-verify-sdk"
version = "0.1.0"
description = "Typed Python client for the EUDI Verify API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Attack contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.9"
strict = true
mypy_path = "src"
packages = ["eudi_verify_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
