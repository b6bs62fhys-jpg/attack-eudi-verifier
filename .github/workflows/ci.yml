name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: 22.x

# Je Branch eine Gruppe, damit ein neuer Push auf denselben Branch einen
# laufenden Lauf abbricht, statt ihn zu verdoppeln. Auf main wird NICHT
# abgebrochen: dort ist der Lauf selbst der Nachweis, und ein abgebrochener
# Push auf main hinterließe eine unvollständige Prüfung ohne Ergebnis.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependencies:
    name: Install and cache dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

  typecheck:
    name: Typecheck
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: Test suite
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage

  flake-watch:
    name: Flake watch (repeated time-dependent tests)
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Wiederholt die zeitabhängigen Testdateien. Ein Test, der nur durch Uhr
      # oder Last kippt, liefert sonst einen roten Lauf ohne zuordenbare
      # Ursache. Ein einzelner roter Durchlauf bricht den Job ab.
      #
      # Eigener Job statt Schritt im Testlauf: die Wiederholungen brauchen je
      # einen frischen Prozess mit frischem Zustand. `vitest --repeats` teilt
      # sich den Dienst zwischen den Durchläufen, dann greift nach 60 Anfragen
      # je Minute das Ratenlimit und der Lauf meldet 429 statt 201. Als Schritt
      # im Testlauf würde es zusätzlich dessen Cache teilen und die
      # Gesamtlaufzeit verdoppeln.
      #
      # Dauer etwa 55 s bei 10 Wiederholungen, gedeckelt durch
      # FLAKE_BUDGET_MS im Skript und timeout-minutes hier.
      - run: npm run test:flake

  sdk:
    name: SDK consistency
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Eigenes Lockfile im SDK, darum eigener Cache-Eintrag statt der
      # Wurzelliste.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
        working-directory: sdk/typescript
      # Der Drift-Waechter erzeugt src/generated.ts neu aus openapi.yaml und
      # vergleicht byteweise. Ohne diesen Schritt bleibt eine veraltete Datei
      # unentdeckt, bis ein Aufrufer genau die fehlende Route braucht.
      - run: npm run generate:check
        working-directory: sdk/typescript
      - run: npm run build
        working-directory: sdk/typescript
      - run: npm test
        working-directory: sdk/typescript

  sdk-python:
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 3.9 ist die in pyproject.toml deklarierte Untergrenze
    # (requires-python = ">=3.9") und zugleich die mypy-Zielversion. 3.12 ist
    # eine aktuelle Version; beide zu prüfen deckt die Untergrenze und eine
    # aktuelle Laufzeit ab. fail-fast: false, damit ein Fehler auf 3.12 das
    # Ergebnis für 3.9 nicht verdeckt — beide Ergebnisse sind einzeln
    # auswertbar.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    # Genau ein name: auf Jobebene. Ein zweites name: innerhalb der Matrix ist
    # ein doppelter YAML-Schlüssel und macht die Datei unlesbar.
    name: SDK Python (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Die Entwicklungsabhängigkeiten stehen als Extra in pyproject.toml
          # (mypy, pytest). Eine eigene requirements-Datei wäre eine zweite
          # Wahrheit und könnte davon abweichen, also hasht der Cache direkt
          # pyproject.toml.
          cache-dependency-path: sdk/python/pyproject.toml
      - run: python -m pip install --upgrade pip
      # Extra statt Einzelinstall: damit kann die Werkzeugliste nicht
      # auseinanderlaufen.
      - run: pip install ".[dev]"
        working-directory: sdk/python
      # Ohne Installationsschritt finden die Tests das Paket nicht: es liegt
      # unter src/ und die Tests importieren `eudi_verify_sdk` direkt. Deshalb
      # wird es als Paket installiert und nicht über PYTHONPATH gelöst.
      - name: mypy
        run: python -m mypy
        working-directory: sdk/python
      - name: pytest
        run: python -m pytest -q
        working-directory: sdk/python

  sdk-kotlin:
    name: SDK Kotlin
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Java 21 ist in sdk/kotlin/build.gradle.kts als Toolchain festgelegt
      # (JavaLanguageVersion.of(21)). setup-java stellt genau diese Laufzeit
      # bereit, damit Gradle die Toolchain nicht selbst suchen muss.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # `cache-cleanup` ersetzt `gradle-home-cache-cleanup`. Der alte Name
          # ist in v6 als deprecated markiert und erzeugte eine Warnung im
          # Job-Summary.
          #
          # Der neue Parameter ist KEIN Boolean, sondern eine Aufzaehlung.
          # Ein `true` laesst den Job abbrechen:
          #   TypeError: The value 'true' is not valid for cache-cleanup.
          #   Valid values are: [never, always, on-success].
          # 'on-success' ist der Default und entspricht der Wirkung des alten
          # `gradle-home-cache-cleanup: true`: aufraeumen, wenn alle
          # Gradle-Laeufe des Jobs erfolgreich waren.
          cache-cleanup: on-success
      # `test` laeuft ueber JUnit Platform und schliesst beide Testquellen ein:
      # AttackClientTest.kt (Kotlin) und JavaInteropTest.java (Java). Der
      # Interop-Test ist der Grund fuer den Job, er prueft die Java-Sichtbarkeit
      # der Kotlin-API und faellt ausserhalb dieses Jobs durch.
      - name: gradle test
        run: gradle test --console=plain --no-daemon
        working-directory: sdk/kotlin
      # Belege, dass der Job beide Quellen ausgefuehrt hat und nicht etwa nur
      # die Kotlin-Tests. Ohne diesen Schritt koennte eine leere Testauswahl
      # als Erfolg durchgehen.
      - name: Testnachweis
        # working-directory ist zwingend: die Ergebnisdateien liegen unter
        # sdk/kotlin/build/test-results/test. Ohne diese Angabe sucht der Schritt
        # im Repo-Root, findet nichts und meldet fälschlich, der Job habe keine
        # Java-Tests ausgeführt. Genau das ist im ersten Lauf passiert.
        run: |
          gesamt=$(grep -ho 'tests="[0-9]*"' build/test-results/test/*.xml | grep -oE '[0-9]+' | paste -sd+ - | bc)
          echo "Tests gesamt: $gesamt"
          test -f build/test-results/test/TEST-de.eudi.verify.sdk.JavaInteropTest.xml \
            || { echo "JavaInteropTest wurde nicht ausgefuehrt"; exit 1; }
          java_tests=$(grep -ho 'tests="[0-9]*"' build/test-results/test/TEST-de.eudi.verify.sdk.JavaInteropTest.xml | grep -oE '[0-9]+')
          echo "JavaInteropTest: $java_tests Tests"
          test "$java_tests" -gt 0 || { echo "JavaInteropTest hat 0 Tests"; exit 1; }
          test "$gesamt" -gt "$java_tests" || { echo "Es laufen nur die Java-Tests"; exit 1; }
        working-directory: sdk/kotlin
      # Kompiliert auch das Java-Ziel. `gradle test` kompiliert die
      # Java-Testquelle mit, aber `gradle build` prueft zusaetzlich die
      # Hauptquelle aus Sicht eines Java-Konsumenten.
      - name: gradle build
        run: gradle build --console=plain --no-daemon
        working-directory: sdk/kotlin

  audit:
    name: Dependency audit
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  # Coverage-Schwelle. Die Grenzen stehen in `vitest.config.ts` und werden dort
  # mit dem gemessenen Stand begruendet. Vitest prueft sie von sich aus und
  # laeuft bei unterschrittener Grenze mit Exit 1 -- gegengeprueft, siehe
  # docs/bericht-paket-6.md.
  coverage:
    name: Coverage threshold
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Coverage messen und Schwellen pruefen
        run: npm run test:coverage

  # Baut das Produktionsimage. Ohne Registry-Push und ohne Secrets: der Job
  # beweist, dass das Dockerfile im PR noch baut, und nichts sonst.
  #
  # Zwei Dinge, die dieser Job bewusst nicht tut. Er pusht nicht, weil ein
  # PR nichts veroeffentlichen darf. Und er startet den Container nicht mit
  # Produktionsmaterial, weil dafuer Geheimnisse noetig waeren; der
  # Produktionsstart ist in docs/release-pruefung.md Abschnitt 5.1 belegt.
  # Baut das Produktionsimage, prueft seinen Inhalt und startet es danach.
  #
  # Kein Registry-Push: ein PR veroeffentlicht nichts. Keine Secrets: das
  # Testmaterial erzeugt der Job selbst.
  #
  # Der Bau allein beweist wenig. Ein Image kann bauen und beim Start abbrechen,
  # weil eine transitiv erreichte Laufzeitdatei fehlt oder eine
  # Pflichtvariable nicht gesetzt ist. Beides faellt erst beim Start auf.
  docker-build:
    name: Docker build and start
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Ohne diese Zeile sieht der Job keinen Digest vor und wuerde bei jedem
      # Lauf neu ziehen. Der gepinnte Digest ist eine Eigenschaft, kein Wunsch.
      - name: Digest nachziehen
        run: docker pull node:22-bookworm-slim

      - name: Image bauen
        run: docker build -t attack:ci .

      # Fuer die Materialerzeugung unten. `@peculiar/x509` und der
      # reflect-Polyfill, den es braucht, sind Abhaengigkeiten des Projekts und
      # nicht Teil des Images. Ohne diesen Schritt meldet der erste Lauf
      # "Cannot find package 'reflect-metadata'".
      - name: Werkzeugabhaengigkeiten installieren
        run: npm ci

      - name: Inhalt pruefen
        run: |
          set -euo pipefail
          echo "::group::Dateien im Produktionsimage"
          anzahl=$(docker run --rm --entrypoint sh attack:ci -c 'find /app/src -type f | wc -l')
          echo "Dateien in /app/src: $anzahl"
          echo "::endgroup::"

          # Keine Testdateien im Produktionsimage. Ein `*.test.ts` waere ein
          # Hinweis, dass die Liste der Laufzeitdateien im Dockerfile veraltet
          # ist und wieder zu grob geworden ist.
          tests=$(docker run --rm --entrypoint sh attack:ci -c 'find /app/src -name "*.test.ts" | wc -l')
          if [ "$tests" != "0" ]; then
            docker run --rm --entrypoint sh attack:ci -c 'find /app/src -name "*.test.ts"'
            echo "::error::Im Produktionsimage liegen $tests Testdateien."
            exit 1
          fi

          # Kein Schluesselmaterial und keine Umgebungsdatei im Image. Beides
          # kommt zur Laufzeit ueber Mount oder Secrets.
          if docker run --rm --entrypoint sh attack:ci -c 'find / -name "*.pem" -o -name "*.p12" -o -name ".env*" 2>/dev/null | grep -q .'; then
            echo "::error::Schluesselmaterial oder .env im Image."
            exit 1
          fi

          # Der Einstiegspunkt muss existieren. Fehlt eine der transitiv
          # erreichten Laufzeitdateien, bricht der Start mit "Cannot find module" ab —
          # das ist der Fehler, den dieser Job frueh sichtbar machen soll.
          if ! docker run --rm --entrypoint sh attack:ci -c 'test -f /app/src/service/run.ts'; then
            echo "::error::src/service/run.ts fehlt im Image."
            exit 1
          fi

      - name: Testmaterial erzeugen
        # Selbstsigniertes Material, im Job erzeugt. Nichts aus dem
        # Repository, nichts committet, nichts ins Image gebacken.
        #
        # Das Verzeichnis liegt unter `$RUNNER_TEMP` und nicht unter `/tmp`.
        # Auf einem Entwicklerrechner mit Colima teilt die VM nur `$HOME`, und
        # ein Mount aus `/tmp` erscheint im Container als leeres Verzeichnis.
        # Auf dem GitHub-Runner ist beides dasselbe Verzeichnis, die
        # Schreibweise ist aber portabel. Gemessen: gleiche Dateien, ueber
        # `$HOME` drei im Container, ueber `/tmp` null.
        #
        # Das Skript liegt in einer Datei statt in `node -e '...'`. In
        # doppelten Anfuehrungszeichen ist jedes Anfuehrungszeichen im
        # JavaScript ein Fehler: ein Backtick wird zur Befehlsausfuehrung, ein
        # doppeltes Anfuehrungszeichen beendet das Argument. Beides ist
        # nacheinander passiert, mit der Folge dass das Material im falschen
        # Verzeichnis landete und der Container mit einer leeren Meldung
        # abbrach. Mit einer Datei entfaellt die Falle.
        #
        # Die Datei liegt im Workspace, nicht in `$RUNNER_TEMP`: node loest
        # `reflect-metadata` und `@peculiar/x509` relativ zur Skriptdatei auf.
        # Ausserhalb des Repos gibt es kein node_modules und der Lauf endet mit
        # "Cannot find package 'reflect-metadata'". Das ist im zweiten Lauf so
        # passiert.
        run: |
          set -euo pipefail
          MAT="$RUNNER_TEMP/ci-startmaterial"
          rm -rf "$MAT" && mkdir -p "$MAT"
          cat > ./erzeuge-material.mjs <<'ERZEUGER'
          import 'reflect-metadata';
          import { X509CertificateGenerator } from '@peculiar/x509';
          import { writeFileSync } from 'node:fs';

          const DIR = process.argv[2];
          const notBefore = new Date(Date.now() - 86400000);
          const notAfter = new Date(Date.now() + 31536000000);

          // Base64 in 64-Zeichen-Zeilen, mit Umbruch nach JEDER Zeile.
          // Ohne den Umbruch klebt die letzte Datenzeile direkt am END-Marker
          // und der Dienst meldet eine unbrauchbare Zertifikatskette.
          const b64 = (bytes) => {
            const zeilen = Buffer.from(bytes).toString('base64').match(/.{1,64}/g) ?? [];
            return zeilen.join('\n') + '\n';
          };

          const key = () => crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);

          const selfSigned = async (name, keys) =>
            X509CertificateGenerator.createSelfSigned({
              serialNumber: crypto.randomUUID().replace(/-/g, ''),
              name,
              notBefore,
              notAfter,
              keys,
              signingAlgorithm: { name: 'ECDSA', hash: 'SHA-256' },
            });

          const vKeys = await key();
          const vCert = await selfSigned('CN=CI Startpruefung Verifier, C=DE', vKeys);
          writeFileSync(DIR + '/verifier-key.pem',
            '-----BEGIN PRIVATE KEY-----\n' + b64(await crypto.subtle.exportKey('pkcs8', vKeys.privateKey)) + '-----END PRIVATE KEY-----\n');
          writeFileSync(DIR + '/verifier-chain.pem',
            '-----BEGIN CERTIFICATE-----\n' + b64(new Uint8Array(vCert.rawData)) + '-----END CERTIFICATE-----\n');

          const aKeys = await key();
          const aCert = await selfSigned('CN=CI Startpruefung Aussteller, C=DE', aKeys);
          writeFileSync(DIR + '/issuer-anchors.pem',
            '-----BEGIN CERTIFICATE-----\n' + b64(new Uint8Array(aCert.rawData)) + '-----END CERTIFICATE-----\n');
          ERZEUGER
          echo "::group::Selbstsigniertes Testmaterial erzeugen"
          node ./erzeuge-material.mjs "$MAT"
          ls -l "$MAT"
          # Leer ist ein Fehler. Ohne diese Zeile fällt ein späterer Fehler an
          # der falschen Stelle auf — so, wie es im ersten Lauf passiert ist.
          anzahl=$(ls -1 "$MAT" | wc -l)
          if [ "$anzahl" -lt 3 ]; then
            echo "::error::Es wurden nur $anzahl statt 3 Dateien erzeugt."
            exit 1
          fi
          echo "::endgroup::"
      - name: Container starten
        run: |
          set -euo pipefail
          MAT="$RUNNER_TEMP/ci-startmaterial"
          echo "::group::Container starten"
          docker run -d --name attack-startcheck -p 18085:8080 \
            -e NODE_ENV=production \
            -v "$MAT:/run/secrets:ro" \
            -e ATTACK_VERIFIER_KEY_PEM=/run/secrets/verifier-key.pem \
            -e ATTACK_VERIFIER_CERT_CHAIN_PEM=/run/secrets/verifier-chain.pem \
            -e ATTACK_ISSUER_TRUST_ANCHORS_PEM=/run/secrets/issuer-anchors.pem \
            attack:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18085/live >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:18085/live; then
            echo "::error::Der Container antwortet nicht auf /live."
            docker logs attack-startcheck
            exit 1
          fi
          echo "::endgroup::"

      - name: Nachweise
        run: |
          set -euo pipefail
          echo "--- /live ---"
          curl -s http://127.0.0.1:18085/live
          echo ""
          echo "--- /health ---"
          curl -s http://127.0.0.1:18085/health
          echo ""
          # Nicht root. Der Dienst soll unter einem eigenen Benutzer laufen.
          echo "--- Benutzer ---"
          docker exec attack-startcheck id
          uid=$(docker exec attack-startcheck id -u)
          if [ "$uid" = "0" ]; then
            echo "::error::Der Container laeuft als root."
            exit 1
          fi
          # Keine Entwicklungswarnung im Produktionsstart.
          dev=$(docker logs attack-startcheck 2>&1 | grep -cE "ATTACK_DEV_MODE|TEST-MATERIAL|Test-Mandanten|ABGESCHALTET" || true)
          if [ "$dev" != "0" ]; then
            echo "::error::$dev Entwicklungswarnungen im Produktionsstart."
            docker logs attack-startcheck
            exit 1
          fi
          echo "--- Startlog ---"
          docker logs attack-startcheck

      - name: Aufraeumen
        # Auch bei Fehlschlag: sonst bleibt der Container auf dem Runner
        # liegen und der Job wirkt wie gehaengend.
        if: always()
        run: |
          docker rm -f attack-startcheck >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/ci-startmaterial" || true
          rm -f ./erzeuge-material.mjs || true

      - name: Groesse melden
        run: |
          bytes=$(docker image inspect attack:ci --format '{{.Size}}')
          echo "Image-Groesse: $bytes Bytes"
          echo "Image-Groesse: $bytes Bytes" >> "$GITHUB_STEP_SUMMARY"

  # Trockenlauf der Veroeffentlichung. Packt die drei SDKs, prueft ihren Inhalt
  # und legt ein SBOM ab, ohne etwas zu veroeffentlichen. Ohne diesen Job faellt
  # ein kaputtes Paket erst beim ersten echten Release auf.
  release-dryrun:
    name: Release dry run
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # npm: was wuerde in die Tarpackung gehen?
      - name: TypeScript-SDK packen
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build
          npm pack --dry-run > pack-ausgabe.txt 2>&1
          cat pack-ausgabe.txt
      - name: Tarball enthaelt keine Quellen und keine Testdateien
        working-directory: sdk/typescript
        run: |
          # 'files' laesst nur dist und README zu. Wird das Feld entfernt,
          # schleicht der Quelltext mit src/ und *.test.ts ins Paket.
          if grep -qE ' src/| \.test\.' pack-ausgabe.txt; then
            echo "::error::Tarball enthaelt Quelltext oder Testdateien."
            exit 1
          fi
          if ! grep -q 'dist/index.js' pack-ausgabe.txt; then
            echo "::error::Der Einstiegspunkt dist/index.js fehlt im Tarball."
            exit 1
          fi

      # Python: sdist und wheel bauen, beide auf Inhalt pruefen.
      - name: Python-SDK bauen
        working-directory: sdk/python
        run: python -m pip install --upgrade pip && pip install build && python -m build
      - name: Artefakte pruefen
        working-directory: sdk/python
        run: |
          ls -1 dist/
          # Das wheel darf keine Tests enthalten. Der sdist darf sie enthalten,
          # das ist bei Python ueblich und noetig, damit die Tests laufen
          # koennen, wenn der Quelltext aus dem sdist gebaut wird.
          python - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob('dist/*.whl')
          if not wheels:
              sys.exit('::error::kein wheel gebaut')
          names = zipfile.ZipFile(wheels[0]).namelist()
          bad = [n for n in names if 'test' in n.split('/')[-1]]
          if bad:
              sys.exit('::error::Testdateien im wheel: ' + ', '.join(bad))
          print('wheel sauber:', wheels[0], len(names), 'Eintraege')
          PY

      # Kotlin: nur pruefen, dass die Aufgabe existiert und laeuft.
      - name: Kotlin-SDK pruefen
        working-directory: sdk/kotlin
        run: |
          # publishToMavenLocal existiert nur, wenn das Plugin 'maven-publish'
          # angewandt ist. Es ist es derzeit nicht; der Job sagt das laut und
          # faellt nicht, solange es keine Veroeffentlichung gibt. Sobald das
          # Plugin kommt, prueft dieser Schritt es automatisch mit.
          if gradle -q tasks --all 2>/dev/null | grep -q 'publishToMavenLocal'; then
            echo "::notice::publishToMavenLocal ist verfuegbar und wird ausgeuehrt."
            gradle publishToMavenLocal
          else
            echo "::notice::Kein maven-publish-Plugin, also keine Veroeffentlichung fuer Kotlin. Offene Entscheidung, siehe docs/release-pruefung.md."
          fi

      # SBOM: npm bringt CycloneDX eingebaut mit, also ohne zusaetzliches Paket.
      # `npm ci` fehlt hier absichtlich nicht: `npm sbom` liest den Baum aus
      # node_modules und meldet ohne Installation jeden Eintrag als fehlend
      # (ESBOMPROBLEMS, exit 1). Das ist im ersten Lauf genau so passiert.
      - name: Abhaengigkeiten fuer die SBOM installieren
        run: npm ci
      - name: SBOM Root (CycloneDX)
          # `npm sbom` laeuft einmal, die Komponentenzahl wird aus der
          # erzeugten Datei gelesen. Vorher stand der Befehl zweimal da:
          # einmal in die Datei und noch einmal durch die Pipe nach stdout.
        run: |
          npm sbom --sbom-format cyclonedx --sbom-type application > sbom-root.cdx.json
          node -e "const b=require('./sbom-root.cdx.json'); console.log('Root-SBOM Komponenten:', b.components.length)"
      - name: SBOM TypeScript-SDK (CycloneDX)
        working-directory: sdk/typescript
        # `npm ci` stand schon im Pack-Schritt weiter oben, deshalb hier kein
        # zweites. Die SBOM braucht den installierten Baum.
        run: npm sbom --sbom-format cyclonedx --sbom-type library > sbom-sdk-typescript.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          if-no-files-found: error
          retention-days: 30
          path: |
            sbom-root.cdx.json
            sdk/typescript/sbom-sdk-typescript.cdx.json
